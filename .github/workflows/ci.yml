name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run PHPCS
        continue-on-error: true
        run: ./vendor/bin/phpcs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test (PHP ${{ matrix.php }})

    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Unit tests
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest tests/Unit --no-coverage --exclude-group=mysql,postgres

      - name: Run Feature tests
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest tests/Feature --no-coverage --exclude-group=mysql,postgres

  test-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test (MySQL advisory locks)

    # Race-safety around booking creation is guarded by a named advisory lock,
    # and sqlite has no equivalent — so these tests need a real server. The
    # suite skips them when one is unreachable, which keeps a local run green;
    # BOOKINGS_REQUIRE_EXTERNAL_DB turns that skip into a failure here, so a
    # broken service container cannot pass as "race-safety verified".
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bookings_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run MySQL tests
        env:
          XDEBUG_MODE: off
          BOOKINGS_REQUIRE_EXTERNAL_DB: 1
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bookings_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: vendor/bin/pest --group=mysql --no-coverage

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test (Postgres advisory locks)

    # The same guard on the other engine an application might deploy on:
    # pg_advisory_xact_lock rather than GET_LOCK.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bookings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Postgres tests
        env:
          XDEBUG_MODE: off
          BOOKINGS_REQUIRE_EXTERNAL_DB: 1
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: bookings_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: vendor/bin/pest --group=postgres --no-coverage
